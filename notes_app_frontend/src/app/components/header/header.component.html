<header class="header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"></div>
    <div class="brand-text">
      <div class="brand-title">{{ title }}</div>
      <div class="brand-subtitle">Personal notes, beautifully organized</div>
    </div>
  </div>

  <div class="actions">
    <label class="search" aria-label="Search notes">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input
        type="search"
        [(ngModel)]="searchText"
        (ngModelChange)="searchTextChange.emit($event)"
        placeholder="Search notes..."
      />
    </label>

    <button class="btn btn-primary" type="button" (click)="createNote.emit()">
      <span class="btn-icon" aria-hidden="true">＋</span>
      New note
    </button>
  </div>
</header>
